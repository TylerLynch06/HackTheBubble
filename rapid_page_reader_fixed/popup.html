<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rapid Page Reader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Rapid Page Reader</h1>
    <p id="status" role="status">Ready to read this page.</p>

    <label for="speed">Speech speed <strong id="speedValue">8.5×</strong></label>
    <input id="speed" type="range" min="1" max="10" step="0.5" value="8.5">
    <div class="scale"><span>Normal</span><span>Extremely fast</span></div>

    <div class="buttons">
      <button id="read" class="primary">Read page</button>
      <button id="pause">Pause</button>
      <button id="resume">Resume</button>
      <button id="stop" class="danger">Stop</button>
    </div>
    <p class="hint">Uses Chrome's built-in text-to-speech voices. Actual speed and voice quality depend on your system.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
