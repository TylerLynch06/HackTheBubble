<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 220px;
      padding: 15px;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
      color: #4ade80;
    }
    p {
      font-size: 12px;
      color: #a1a1aa;
      margin-bottom: 15px;
    }
    button {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .off {
      background-color: #27272a;
      color: #ffffff;
    }
    .on {
      background-color: #4ade80;
      color: #000000;
    }
  </style>
</head>
<body>
  <h3>Power Saving Mode</h3>
  <p id="status">~4-5 FPS + Heavy Compression (Inactive)</p>
  <button id="toggleBtn" class="off">Enable Eco Mode</button>
  <script src="popup.js"></script>
</body>
</html>
