<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head>
<body>
  <main>
    <header>
      <div>
        <h1>Lightmode</h1>
        <p>On/off: Alt+Shift+F &middot; Mode: Alt+Shift+B</p>
      </div>
      <label class="switch" title="Turn on or off"><input type="checkbox" id="enabled"><span></span></label>
    </header>

    <div class="modes" role="group" aria-label="Mode">
      <button type="button" id="mode-dark">Dark flashlight</button>
      <button type="button" id="mode-bright">Blinding light</button>
    </div>

    <section>
      <div class="row"><label for="radius">Beam size</label><output id="radius-o"></output></div>
      <input type="range" id="radius" min="60" max="400" step="5">
      <div class="row"><label for="softness">Soft edge</label><output id="softness-o"></output></div>
      <input type="range" id="softness" min="0" max="100" step="1">
      <div class="row" id="row-dark"><label for="darkness">Darkness</label><output id="darkness-o"></output></div>
      <input type="range" id="darkness" min="50" max="100" step="1">
      <div class="row" id="row-bright"><label for="intensity">Brightness</label><output id="intensity-o"></output></div>
      <input type="range" id="intensity" min="10" max="100" step="1">
      <p class="warn" id="warn">Very bright. Be careful in a dark room, and turn your screen down if it hurts.</p>
    </section>

    <section>
      <div class="row" id="row-warm"><label for="warm">Warm light</label><label class="switch"><input type="checkbox" id="warm"><span></span></label></div>
      <div class="row"><label for="hideCursor">Hide the mouse pointer</label><label class="switch"><input type="checkbox" id="hideCursor"><span></span></label></div>
    </section>

    <button id="site" type="button"></button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
