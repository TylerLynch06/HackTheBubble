<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Liquid Life</title>
  <style>
    body {
      margin: 0; width: 250px; padding: 14px;
      font: 500 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #0b2540; background: linear-gradient(160deg, #e8f6ff, #b9dcff);
    }
    h1 { margin: 0 0 2px; font-size: 17px; letter-spacing: -.01em; }
    p { margin: 0 0 10px; opacity: .7; font-size: 12px; }
    button {
      display: flex; justify-content: space-between; align-items: center; width: 100%;
      margin: 0 0 6px; padding: 9px 12px; border-radius: 12px; cursor: pointer;
      border: 1px solid rgba(255,255,255,.8); background: rgba(255,255,255,.55);
      font: inherit; color: inherit; text-align: left;
    }
    button:hover { background: rgba(255,255,255,.85); }
    button.on { background: #0a84ff; color: #fff; border-color: #0a84ff; }
    kbd { font: 600 11px ui-monospace, Consolas, monospace; opacity: .7; }
    footer { margin-top: 6px; font-size: 11px; opacity: .65; }
  </style>
</head>
<body>
  <h1>Liquid Life</h1>
  <p>The web, finally wet.</p>
  <div id="stages"></div>
  <footer>Alt+. next · Alt+, back · Alt+W whirlpool · Alt+S ships · Alt+K kraken · Alt+M megalodon · Alt+H whale · Alt+P paywall · Esc ×3 drains</footer>
  <script src="popup.js"></script>
</body>
</html>
