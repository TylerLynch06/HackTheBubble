<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 180px;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 8px;
      font-size: 14px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background-color: #111;
      color: #fff;
    }
    button.off {
      background-color: #ccc;
      color: #333;
    }
  </style>
</head>
<body>
  <h3 style="margin-top: 0;">Minimalist Mode</h3>
  <button id="toggleBtn">Enabled</button>
  <script src="popup.js"></script>
</body>
</html>
